name: JOELMA - Finalizar Auth v2 e Produção

on:
  push:
    branches:
      - codex/joelma-auth-v2
    paths:
      - .github/workflows/joelma-finalize.yml

permissions:
  contents: write

concurrency:
  group: joelma-final-cutover
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: onrmaojjvcbqbgwuhzwq
      AUTH_BASE_SHA: 56385ca87a7c4d2d891eae57af243ab449ccd29b
      BOOKING_BUNDLE_SHA256: 1b0e4069d0f26dc6c80a9a296c4750c88d08021377c33dbe3c473cc33bf7be24
      BOOKING_INDEX_SHA256: f6765b5fae30caec712f3376a98ec7b8761e23a4738ce7c7062a9303a0385c9f
      BOOKING_BUNDLE_B64: ""

    steps:
      - name: Checkout da branch Auth v2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validar origem e evitar sobrescrita
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          git cat-file -e "$AUTH_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$AUTH_BASE_SHA" HEAD
          CHANGED="$(git diff --name-only "$AUTH_BASE_SHA"..HEAD)"
          test "$CHANGED" = ".github/workflows/joelma-finalize.yml"
          git fetch origin main
          git merge-base --is-ancestor origin/main "$AUTH_BASE_SHA"
          node --check app.js
          grep -q 'AUTH_API_URL' app.js
          grep -q 'login-with-phone' app.js
          grep -q 'resetPasswordForEmail' app.js
          grep -q 'PASSWORD_RECOVERY' app.js
          test -f supabase/functions/joelma-auth/index.ts
          test -f supabase/migrations/20260817_customer_events.sql

      - name: Materializar joelma-booking endurecido
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BOOKING_BUNDLE_B64" | base64 -d > /tmp/joelma-booking.tar.xz
          echo "$BOOKING_BUNDLE_SHA256  /tmp/joelma-booking.tar.xz" | sha256sum -c -
          rm -rf supabase/functions/joelma-booking
          mkdir -p supabase/functions/joelma-booking
          tar -xJf /tmp/joelma-booking.tar.xz -C supabase/functions/joelma-booking
          echo "$BOOKING_INDEX_SHA256  supabase/functions/joelma-booking/index.ts" | sha256sum -c -
          python - <<'PYSEC'
          from pathlib import Path
          s=Path('supabase/functions/joelma-booking/index.ts').read_text()
          start=s.index('if (body.action === "book")')
          auth=s.index('await authenticatedUser(req)', start)
          rpc=s.index('joelma_create_booking', start)
          assert auth < rpc, 'booking precisa autenticar antes do RPC'
          segment=s[start:rpc]
          for forbidden in ('body.customerName', 'body.customerPhone', 'body.customerEmail'):
              assert forbidden not in segment, f'identidade nao pode vir do navegador: {forbidden}'
          assert 'profile.full_name' in s and 'user.email' in s
          print('SECURITY_REGRESSION=PASS')
          PYSEC
          git diff --check

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Aplicar customer_events de forma idempotente
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYDB'
          import json, os, urllib.request, urllib.error
          token=os.environ['SUPABASE_ACCESS_TOKEN']
          ref=os.environ['SUPABASE_PROJECT_ID']
          endpoint=f'https://api.supabase.com/v1/projects/{ref}/database/query'
          def query(sql, read_only):
              req=urllib.request.Request(
                  endpoint,
                  data=json.dumps({'query': sql, 'read_only': read_only}).encode(),
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode() or 'null')
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  raise SystemExit(f'Management API SQL falhou HTTP {e.code}: {body[:900]}')
          probe=query("select to_regclass('public.customer_events') as rel", True)
          def has_table(v):
              if isinstance(v, dict): return any(has_table(x) for x in v.values())
              if isinstance(v, list): return any(has_table(x) for x in v)
              return v in ('customer_events', 'public.customer_events')
          if has_table(probe):
              print('CUSTOMER_EVENTS=EXISTS')
          else:
              sql=open('supabase/migrations/20260817_customer_events.sql', encoding='utf-8').read()
              query(sql, False)
              print('CUSTOMER_EVENTS=CREATED')
          PYDB

      - name: Publicar joelma-auth primeiro
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy joelma-auth \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api
          STATUS="$(curl -sS -o /tmp/joelma-auth-smoke.json -w '%{http_code}' \
            -X POST "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/joelma-auth" \
            -H 'Content-Type: application/json' \
            --data '{"action":"login-with-phone","identifier":"00000000000","password":"atlas-invalid-test-only"}')"
          test "$STATUS" != "404"
          test "${STATUS:0:1}" != "5"
          if grep -Eqi '"email"[[:space:]]*:' /tmp/joelma-auth-smoke.json; then
            echo 'Resposta de login invalido nao deve expor e-mail' >&2
            exit 1
          fi
          echo "JOELMA_AUTH_SMOKE_HTTP=$STATUS"

      - name: Preparar commit final e promover main sem force
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main "$AUTH_BASE_SHA"
          git config user.name 'ATLAS Joelma Finalizer'
          git config user.email 'atlas-joelma@grupo-lira.local'
          git add supabase/functions/joelma-booking
          git rm .github/workflows/joelma-finalize.yml
          git diff --cached --check
          git commit -m 'feat: finalizar Auth v2 e booking seguro da Joelma'
          git push origin HEAD:main
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Aguardar Vercel publicar Auth v2
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for i in $(seq 1 36); do
            if curl -fsSL "https://app.joelmasouzaoficial.com.br/app.js?atlas=${GITHUB_RUN_ID}-$i" | grep -q 'joelma-auth'; then
              READY=1
              break
            fi
            sleep 10
          done
          test "$READY" = "1"
          echo 'VERCEL_AUTH_V2=LIVE'

      - name: Publicar joelma-booking endurecido
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy joelma-booking \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api

      - name: Smoke tests finais de backend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1"
          AVAIL="$(curl -sS -o /tmp/availability.json -w '%{http_code}' \
            "$BASE/joelma-booking?serviceId=terapia-tantrica-integrativa&date=2099-01-06")"
          test "$AVAIL" = "200"
          BOOK="$(curl -sS -o /tmp/book-noauth.json -w '%{http_code}' \
            -X POST "$BASE/joelma-booking" \
            -H 'Content-Type: application/json' \
            --data '{"action":"book"}')"
          test "$BOOK" = "401"
          grep -q 'nao_autenticado' /tmp/book-noauth.json
          echo "PUBLIC_AVAILABILITY_HTTP=$AVAIL"
          echo "UNAUTH_BOOKING_HTTP=$BOOK"
          echo "JOELMA_BACKEND_SECURITY=PASS"

      - name: Sincronizar branch e remover bootstrap remoto
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/joelma-auth-v2
          echo "FINAL_MAIN_SHA=$MAIN_SHA"
          echo 'JOELMA_CUTOVER=COMPLETED'
