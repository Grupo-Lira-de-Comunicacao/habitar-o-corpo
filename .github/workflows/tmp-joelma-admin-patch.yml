name: Temporary Joelma Admin Patch

on:
  push:
    branches:
      - codex/joelma-mobile-admin-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/joelma-mobile-admin-fix
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply admin/client separation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/joelma-booking/index.ts')
          text = path.read_text(encoding='utf-8')

          admin_start = text.index('async function adminData(req: Request, origin: string | null) {')
          admin_end = text.index('async function updateBookingStatus', admin_start)
          new_admin = '''async function adminData(req: Request, origin: string | null) {
            const user = await authenticatedUser(req);
            if (!user?.email) return json({ ok: false, error: "nao_autenticado" }, 401, origin);
            if (!(await isAdminEmail(user.email))) return json({ ok: false, error: "acesso_negado" }, 403, origin);
            const [bookingsResult, profilesResult, servicesResult, vipResult] = await Promise.all([
              supabase.from("joelma_bookings").select(BOOKING_COLUMNS).order("starts_at", { ascending: false }),
              supabase.from("joelma_profiles").select("user_id,email,full_name,phone,city,is_vip,active,accepted_terms_at,created_at,updated_at").order("created_at", { ascending: false }),
              supabase.from("joelma_services").select(SERVICE_COLUMNS).order("sort_order", { ascending: true }).order("name", { ascending: true }),
              supabase.from("joelma_vip_contents").select(VIP_COLUMNS).order("sort_order", { ascending: true }).order("created_at", { ascending: false }),
            ]);
            if (bookingsResult.error || profilesResult.error || servicesResult.error || vipResult.error) { console.error("admin_data_error", bookingsResult.error?.code ?? profilesResult.error?.code ?? servicesResult.error?.code ?? vipResult.error?.code); return json({ ok: false, error: "falha_ao_carregar_painel" }, 500, origin); }
            const adminFlags = await Promise.all(
              (profilesResult.data ?? []).map((profile) => isAdminEmail(String(profile.email ?? ""))),
            );
            const clientProfiles = (profilesResult.data ?? []).filter(
              (profile, index) =>
                String(profile.email ?? "").toLowerCase() !== user.email.toLowerCase() &&
                adminFlags[index] !== true,
            );
            return json({ ok: true, bookings: (bookingsResult.data ?? []).map(publicBooking), clients: clientProfiles.map(publicProfile), services: (servicesResult.data ?? []).map(publicService), vipContents: (vipResult.data ?? []).map(publicVipContent) }, 200, origin);
          }

          '''
          text = text[:admin_start] + new_admin + text[admin_end:]

          vip_start = text.index('async function setClientVip(payload: Record<string, unknown>, req: Request, origin: string | null) {')
          vip_end = text.index('async function upsertService', vip_start)
          new_vip = '''async function setClientVip(payload: Record<string, unknown>, req: Request, origin: string | null) {
            const user = await authenticatedUser(req);
            if (!user?.email) return json({ ok: false, error: "nao_autenticado" }, 401, origin);
            if (!(await isAdminEmail(user.email))) return json({ ok: false, error: "acesso_negado" }, 403, origin);
            const userId = cleanText(payload.userId, 36);
            if (!validUuid(userId) || typeof payload.isVip !== "boolean") return json({ ok: false, error: "dados_invalidos" }, 400, origin);
            const { data: targetProfile, error: targetError } = await supabase.from("joelma_profiles").select("email").eq("user_id", userId).maybeSingle();
            if (targetError || !targetProfile) return json({ ok: false, error: "cliente_nao_encontrado" }, 404, origin);
            if (await isAdminEmail(String(targetProfile.email ?? ""))) return json({ ok: false, error: "conta_administrativa" }, 403, origin);
            const { error } = await supabase.from("joelma_profiles").update({ is_vip: payload.isVip, updated_at: new Date().toISOString() }).eq("user_id", userId);
            if (error) return json({ ok: false, error: "falha_ao_atualizar_cliente" }, 500, origin);
            return json({ ok: true }, 200, origin);
          }

          '''
          text = text[:vip_start] + new_vip + text[vip_end:]
          path.write_text(text, encoding='utf-8')

          verify = Path('scripts/verify-joelma-production.mjs')
          checks = verify.read_text(encoding='utf-8')
          anchor = "assert(bookingBackend.includes('String(profile.email ?? \\\"\\\").toLowerCase() !== user.email.toLowerCase()'), 'Backend administrativo ainda pode retornar o próprio perfil da administradora como cliente');"
          extra = "\nassert(bookingBackend.includes('const adminFlags = await Promise.all'), 'Backend administrativo não identifica todas as contas administrativas');\nassert(bookingBackend.includes('if (await isAdminEmail(String(targetProfile.email ?? \\\"\\\")))'), 'Endpoint VIP ainda permite alteração de conta administrativa');"
          if extra.strip() not in checks:
            if anchor not in checks:
              raise SystemExit('verification anchor not found')
            checks = checks.replace(anchor, anchor + extra)
            verify.write_text(checks, encoding='utf-8')
          PY

      - name: Verify production build
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/joelma-booking/index.ts scripts/verify-joelma-production.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: separar administradores da lista de clientes"
          git push origin HEAD:codex/joelma-mobile-admin-fix
