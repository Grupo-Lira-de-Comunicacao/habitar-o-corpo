name: Deploy Joelma Admin Services

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/joelma-admin-services/**"
      - ".github/workflows/deploy-joelma-admin-services.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy joelma-admin-services --project-ref onrmaojjvcbqbgwuhzwq --no-verify-jwt
